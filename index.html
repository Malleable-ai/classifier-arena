<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Classifier Arena</title>
    <style>
      :root {
        --bg: #07080f;
        --fg: #e6e8f0;
        --muted: #9aa0b4;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        overflow-x: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 12px 0 16px;
      }
      .stage {
        /* --stage-ratio is set from the logical canvas size (stage plus decision panels). */
        width: min(100vw, calc((100vh - 90px) * var(--stage-ratio, 1.7778)));
        min-width: 0;
        aspect-ratio: var(--stage-ratio, 1.7778);
      }
      .stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Render mode at a video size: the canvas is exactly W x H px at the page's top left. */
      #app.render-root {
        display: block;
        padding: 0;
      }
      /* Render mode without a size: the whole canvas, as large as fits, centred in the window. */
      #app.render-fit {
        height: 100vh;
        padding: 0;
        gap: 0;
        justify-content: center;
      }
      #app.render-fit .stage {
        width: min(100vw, calc(100vh * var(--stage-ratio, 1.7778)));
      }
      .render-canvas {
        display: block;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px 14px;
        max-width: 960px;
        padding: 0 16px;
      }
      .controls p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted);
        text-align: center;
      }
      .controls button {
        font: 600 13px var(--font);
        color: var(--fg);
        background: #1d2033;
        border: 1px solid #3a3f5c;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .controls button[aria-pressed='true'] {
        background: #2dd4bf;
        border-color: #2dd4bf;
        color: #04262b;
      }
      .controls .speeds {
        display: flex;
        gap: 4px;
      }
      .controls .time {
        font-variant-numeric: tabular-nums;
        min-width: 7.5em;
      }
      /* Replay viewer (/): list left, player right; on a phone the player sits above the list. */
      #app.viewer-root {
        display: block;
        padding: 0;
      }
      .viewer {
        display: grid;
        grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
        grid-template-areas: 'list player';
        height: 100vh;
        height: 100dvh;
      }
      .picker {
        grid-area: list;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid #1f2236;
        background: #0b0d18;
      }
      .picker-head {
        padding: 14px 14px 10px;
        border-bottom: 1px solid #1f2236;
      }
      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .picker h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: 0.01em;
      }
      .sandbox-link {
        font-size: 12px;
        color: var(--muted);
      }
      .head-links {
        display: inline-flex;
        gap: 12px;
      }
      .sandbox-link:hover {
        color: var(--fg);
      }
      .picker .sub {
        margin: 2px 0 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .filters {
        display: flex;
        gap: 4px;
      }
      .filters button,
      .playback button {
        font: 600 12px var(--font);
        color: var(--fg);
        background: #1d2033;
        border: 1px solid #3a3f5c;
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .filters button[aria-pressed='true'] {
        background: #2a2f4a;
        border-color: #6b7194;
      }
      .matches {
        list-style: none;
        margin: 0;
        padding: 6px;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
      }
      .matches .empty {
        padding: 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .match {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        text-align: left;
        font: 13px var(--font);
        color: var(--fg);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 9px 10px;
        cursor: pointer;
      }
      .match:hover {
        background: #141729;
      }
      .match[aria-current='true'] {
        background: #16263a;
        border-color: #2dd4bf;
      }
      .match .names {
        font-weight: 600;
        line-height: 1.35;
      }
      .match .names > span + span {
        margin-left: 0.35em;
      }
      .match .vs {
        color: var(--muted);
        font-weight: 400;
      }
      .match .star {
        color: #fbbf24;
      }
      .match .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .match .result {
        color: var(--fg);
      }
      .tags {
        display: inline-flex;
        gap: 4px;
      }
      .tag {
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-radius: 4px;
        padding: 1px 5px;
        border: 1px solid #3a3f5c;
      }
      .tag.ok {
        color: #5eead4;
        border-color: #1f5f58;
      }
      .tag.bad {
        color: #fca5a5;
        border-color: #7f1d1d;
      }
      .tag.local {
        color: #c4b5fd;
        border-color: #4c3d8a;
      }
      .player {
        grid-area: player;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 0;
        min-height: 0;
        padding: 10px 16px;
      }
      .player .stage {
        width: min(100%, calc((100dvh - 76px) * var(--stage-ratio, 1.7778)));
      }
      .player .loading,
      .player [role='alert'] {
        color: var(--muted);
        font-size: 14px;
      }
      /* Chapters wrap on a phone (a clue match has 16 turns). */
      .playback .rounds {
        flex-wrap: wrap;
        justify-content: center;
        max-width: 100%;
      }
      .playback .rounds button {
        min-width: 2.6em;
        padding: 6px 8px;
      }
      .playback .play {
        min-width: 5.5em;
      }
      /* Live mode (/live, dev only). */
      .live-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 0 16px;
      }
      .live-head h1 {
        margin: 0;
        font-size: 18px;
      }
      .live-root .stage {
        width: min(100vw, calc((100dvh - 150px) * var(--stage-ratio, 1.7778)));
      }
      .live-setup select {
        font: 13px var(--font);
        color: var(--fg);
        background: #141729;
        border: 1px solid #3a3f5c;
        border-radius: 6px;
        padding: 6px 8px;
        max-width: 100%;
      }
      .live-setup .vs {
        color: var(--muted);
      }
      .controls button.primary {
        background: #2dd4bf;
        border-color: #2dd4bf;
        color: #04262b;
      }
      .controls button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .live-gate,
      .live-status,
      .live-help,
      .live-error,
      .live-confirm {
        margin: 0;
        padding: 0 16px;
        max-width: 960px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted);
        text-align: center;
      }
      .live-error {
        margin-top: 24px;
        font-size: 15px;
        color: var(--fg);
      }
      .live-confirm {
        color: #fbbf24;
        cursor: pointer;
      }
      .live-estimate {
        margin: 0;
        padding: 8px 12px;
        max-width: calc(100vw - 32px);
        overflow-x: auto;
        font-size: 11.5px;
        color: var(--muted);
        background: #0b0d18;
        border: 1px solid #1f2236;
        border-radius: 6px;
      }
      .live-result a.button {
        font: 600 13px var(--font);
        color: #04262b;
        background: #2dd4bf;
        border-radius: 6px;
        padding: 6px 14px;
        text-decoration: none;
      }
      .live-result p {
        color: var(--fg);
      }
      /* Leaderboard (/). */
      #app.board-root {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 24px 48px;
      }
      .board-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .board-head h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: 0.01em;
      }
      .board-sub {
        margin: 0 0 14px;
        max-width: 70ch;
        font-size: 15px;
        line-height: 1.5;
        color: var(--muted);
      }
      .board-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .board-chip {
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
        text-decoration: none;
        border: 1px solid #2a2f4a;
        border-radius: 999px;
        padding: 6px 12px;
        background: #0b0d18;
      }
      a.board-chip:hover {
        border-color: #2dd4bf;
      }
      .board-chip.muted {
        color: var(--muted);
        font-weight: 400;
      }
      .board-fixture {
        margin: 12px 0 0;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
        color: #fbbf24;
        border: 1px dashed #a16207;
        border-radius: 6px;
      }
      .board-card {
        border: 1px solid #1f2236;
        border-radius: 10px;
        background: #0b0d18;
        padding: 18px 20px;
        min-width: 0;
      }
      .board-card h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      .board-card h3 {
        margin: 16px 0 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .board-empty {
        margin: 0 0 12px;
        font-size: 15px;
        line-height: 1.5;
      }
      .formula {
        margin: 12px 0 0;
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--muted);
      }
      .formula strong {
        color: var(--fg);
      }
      .board-games {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .board-game-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .board-game-head h2 {
        margin: 0;
      }
      .board-link {
        font-size: 14px;
        font-weight: 600;
        color: #2dd4bf;
        text-decoration: none;
        white-space: nowrap;
      }
      .board-link:hover {
        text-decoration: underline;
      }
      .board-muted {
        font-size: 13px;
        color: var(--muted);
      }
      .board-status {
        margin: 4px 0 10px;
        font-size: 13.5px;
        color: var(--muted);
      }
      /* A failed run-level miss check: amber on a dark tint, readable without the colour. */
      .board-warning {
        margin: 0 0 12px;
        padding: 8px 12px;
        border: 1px solid #f59e0b;
        border-left-width: 4px;
        border-radius: 8px;
        background: rgba(245, 158, 11, 0.12);
        color: #fde68a;
        font-size: 13.5px;
        line-height: 1.45;
      }
      .board-warning-sign {
        font-weight: 700;
        color: #fbbf24;
      }
      .board-warning-detail {
        color: #fbbf24;
      }
      /* Matches excluded by hand: the ids wrap so a long one never widens the page. */
      .board-excluded {
        margin: 0 0 12px;
      }
      .board-excluded h3 {
        margin: 0;
      }
      .board-excluded .board-footnote {
        margin: 2px 0 6px;
      }
      .board-excluded ul {
        margin: 0;
        padding-left: 18px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted);
      }
      .board-excluded code {
        overflow-wrap: anywhere;
      }
      .board-excluded a {
        color: #2dd4bf;
      }
      .board-featured {
        display: inline-block;
        margin-top: 14px;
        font-size: 14px;
        color: #fbbf24;
        text-decoration: none;
      }
      .board-featured:hover {
        text-decoration: underline;
      }
      /* Scroll shadows: a table wider than its card shows a teal edge where more columns hide. */
      .table-wrap {
        max-width: 100%;
        overflow-x: auto;
        background:
          linear-gradient(to right, #0b0d18 30%, rgba(11, 13, 24, 0)) left center / 28px 100%
            no-repeat local,
          linear-gradient(to left, #0b0d18 30%, rgba(11, 13, 24, 0)) right center / 28px 100%
            no-repeat local,
          radial-gradient(farthest-side at 0 50%, rgba(45, 212, 191, 0.45), transparent) left
            center / 10px 100% no-repeat scroll,
          radial-gradient(farthest-side at 100% 50%, rgba(45, 212, 191, 0.45), transparent) right
            center / 10px 100% no-repeat scroll;
      }
      .board-footnote {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      .board-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .board-table th,
      .board-table td {
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid #1a1d2e;
        white-space: nowrap;
      }
      .board-table thead th {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        border-bottom-color: #2a2f4a;
      }
      .board-table tbody th {
        font-weight: 600;
      }
      .board-table .num {
        text-align: right;
      }
      .board-table tbody tr:last-child > * {
        border-bottom: 0;
      }
      .stacked {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }
      .stacked .rate {
        font-size: 16px;
        font-weight: 600;
      }
      .stacked .rate.overall {
        font-size: 20px;
        color: #2dd4bf;
      }
      .stacked .detail {
        font-size: 11.5px;
        color: var(--muted);
      }
      .board-notes ul {
        margin: 0;
        padding-left: 18px;
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--muted);
      }
      @media (max-width: 600px) {
        #app.board-root {
          padding: 20px 16px 32px;
          gap: 14px;
        }
        .board-head h1 {
          font-size: 22px;
        }
        .board-card {
          padding: 14px 12px;
        }
        .board-table {
          font-size: 13px;
        }
        .board-table th,
        .board-table td {
          padding: 7px 6px;
        }
        /* Let headers and model names wrap so the numbers fit beside them. */
        .board-table thead th,
        .board-table tbody th {
          white-space: normal;
        }
        .board-table tbody th {
          min-width: 7em;
        }
      }
      /* A game's summary, above its match list. */
      .game-summary {
        margin: 0 0 10px;
        padding: 8px 10px;
        border: 1px solid #1f2236;
        border-radius: 8px;
        background: #0f1222;
        font-size: 12.5px;
      }
      .game-summary p {
        margin: 0;
      }
      .summary-headline {
        font-weight: 600;
        font-size: 13.5px;
      }
      .summary-detail {
        margin-top: 2px !important;
        color: var(--muted);
        line-height: 1.4;
      }
      .summary-table {
        width: 100%;
        margin-top: 6px;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .summary-table th,
      .summary-table td {
        padding: 2px 3px;
        text-align: left;
        white-space: nowrap;
        font-size: 12px;
      }
      .summary-table thead th {
        font-weight: 600;
        color: var(--muted);
        font-size: 11px;
      }
      .summary-table tbody th {
        font-weight: 400;
      }
      .summary-name {
        display: block;
        max-width: 8.5em;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .summary-table .num {
        text-align: right;
      }
      .summary-featured {
        display: block;
        margin-top: 6px;
        padding: 0;
        font: 12.5px var(--font);
        text-align: left;
        color: var(--fg);
        background: transparent;
        border: 0;
      }
      button.summary-featured {
        cursor: pointer;
      }
      button.summary-featured:hover {
        text-decoration: underline;
      }
      .summary-featured .star {
        color: #fbbf24;
      }
      .not-found {
        margin-top: 24px;
        padding: 0 16px;
        color: var(--muted);
      }
      .not-found a {
        color: var(--fg);
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 760px) {
        .viewer {
          display: flex;
          flex-direction: column;
          height: auto;
        }
        .picker {
          border-right: 0;
          border-top: 1px solid #1f2236;
        }
        .matches {
          overflow: visible;
        }
        .player {
          padding: 0 0 10px;
        }
        .player .stage {
          width: 100%;
        }
      }
      @media (max-width: 600px) {
        .stage {
          width: 100vw;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
